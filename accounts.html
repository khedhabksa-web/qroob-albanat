  p { margin: 0 0 28px; font-size: 17px; }
  a { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; margin-bottom: 12px; padding: 12px 18px; border: 1px solid var(--gold); border-radius: 10px; color: var(--ivory); font-weight: 700; font-size: 18px; text-decoration: none; }
  a:hover, a:focus-visible { background: var(--gold); color: var(--wine); }
  a span { direction: ltr; font-weight: 500; font-size: 15px; }
</style>
